<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="title desc" lang="es"><title id="title">Vistas diferencial y completa</title><desc id="desc">Patient es la base de UYPatient, que es la base de HCENPatient. Diferencial muestra cambios; snapshot reúne las reglas propias y heredadas.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.body{font-size:18px}.small{font-size:16px;fill:#42526e}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700;fill:#0057b8}.mono{font:17px Consolas,monospace}.badge{font-size:16px;fill:white;text-anchor:middle;font-weight:700}</style><rect width="960" height="486" rx="12" fill="#f5f8fc"/><text x="28" y="40" class="title">Un perfil, dos formas de consultar sus reglas</text><text x="28" y="70" class="small">HCENPatient · esquema de orientación</text><rect x="28" y="92" width="268" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="48" y="125" class="head">Patient</text><text x="48" y="153" class="small">Recurso base</text><rect x="345" y="92" width="268" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="365" y="125" class="head">UYPatient</text><text x="365" y="153" class="small">Perfil nacional</text><rect x="662" y="92" width="268" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="682" y="125" class="head">HCENPatient</text><text x="682" y="153" class="small">Perfil para HCEN</text><text x="310" y="139" class="head">→</text><text x="627" y="139" class="head">→</text><rect x="28" y="200" width="437" height="232" rx="8" fill="#fff" stroke="#cbd5e1"/><rect x="493" y="200" width="437" height="232" rx="8" fill="#edf5ff" stroke="#0057b8"/><circle cx="57" cy="231" r="14" fill="#0057b8"/><text x="57" y="236" class="badge">1</text><text x="80" y="237" class="head">Diferencial / Differential</text><text x="48" y="274" class="body">¿Qué cambia respecto de UYPatient?</text><text x="48" y="314" class="mono">identifier:mrn   →  1..1</text><text x="48" y="346" class="mono">name            →  0..1 y MS</text><text x="48" y="392" class="small">También puede incluir cambios de texto.</text><circle cx="522" cy="231" r="14" fill="#0057b8"/><text x="522" y="236" class="badge">2</text><text x="545" y="237" class="head">Completa / Snapshot</text><text x="513" y="274" class="body">¿Qué reglas se aplican en conjunto?</text><text x="513" y="314" class="body">Reglas heredadas de Patient</text><text x="513" y="346" class="body">+ reglas nacionales de UYPatient</text><text x="513" y="378" class="body">+ reglas propias de HCENPatient</text><text x="28" y="464" class="small">Para completar una instancia, consultar también las reglas heredadas.</text></svg>