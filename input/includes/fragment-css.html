.uy-site-search input { min-width:0; width:100%; height:36px; padding:7px 12px; color:#24374a; background:transparent; border:0; border-radius:0; box-shadow:none; }

/* Menú inspirado en guias-implementacion. */
.navbar .nav > li > a { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; padding:10px 12px; color:#fff; text-shadow:none; box-shadow:none; }
.navbar-inverse,#segment-navbar > .container { background:#0057b8; }

.navbar-inverse .navbar-nav > .open > a { background:#002b6e; color:#fff; }

.navbar .dropdown-menu > li > a { padding:6px 20px; color:#333; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; }
.navbar .dropdown-menu > li > a:hover,
.navbar .dropdown-menu > li > a:focus,
.navbar .dropdown-menu > .active > a { background:#357ebd linear-gradient(to bottom,#428bca,#357ebd); color:#fff; }
.navbar a:focus-visible { outline:2px solid #f5a623; outline-offset:-2px; }
.navbar-inverse .navbar-toggle { border-color:#fff; }
.navbar-inverse .navbar-toggle:hover,.navbar-inverse .navbar-toggle:focus { background:#002b6e; }
.navbar-inverse .navbar-nav > .dropdown > a .caret { border-top-color:#fff; border-bottom-color:#fff; }

/* Contenido: 8px laterales en todos los tamaños; solo se ajusta la fila exterior. */
#segment-content > .container { background:#fff; box-sizing:border-box; padding:28px 8px 40px; }
#segment-content > .container > .row { margin-left:0; margin-right:0; }
#segment-content > .container > .row > .inner-wrapper { margin-top:0; margin-bottom:0; }
#segment-content > .container > .row > .inner-wrapper > .col-12 { padding-left:0; padding-right:0; }
.uy-core-banner { max-width:100%; margin:16px auto 32px; }
.uy-core-banner img { display:block; width:100%; height:auto; border-radius:16px; box-shadow:0 8px 24px #16395920; }
.uy-scope-figure { max-width:640px; margin:24px auto 28px; }
.uy-scope-figure img { display:block; width:100%; height:auto; }
.uy-scope-figure figcaption { margin-top:10px; color:#40566b; font-size:14px; line-height:1.5; text-align:center; }
#segment-content figcaption { font-size:13px; font-weight:700; line-height:1.5; margin-top:8px; margin-bottom:24px; }
/* Mapeos (p.ej. CDA R2): las rutas de destino son cadenas largas sin espacios;
   se ajustan en varias líneas en vez de extender la tabla hacia la derecha. */
#segment-content table[id$="M"] { max-width:100%; }
#segment-content table[id$="M"] td { overflow-wrap:anywhere; word-break:break-word; }
/* HCENConsultaNoUrgente: se oculta la columna de mapeo heredada de
   Composition (FHIR base) que HCEN no utiliza — FiveWs Pattern Mapping
   (6ª y última columna de esta tabla; no tiene columna XDS metadata
   equivalent, esa es propia de perfiles de DocumentReference). No hay
   forma de quitarla del arreglo StructureDefinition.mapping heredado
   vía FSH. */
#segment-content table#uy-consulta-no-urgenteM > tr > :is(th,td):nth-child(6) { display:none; }
/* Ejemplo de HCENConsultaNoUrgente: la narrativa (Composition.text) simula un
   documento clínico con secciones — ver Composition-hcen-cnu-ejemplo-consulta.html
   y la pestaña Ejemplos de StructureDefinition-uy-consulta-no-urgente.html. */
.uy-clinical-doc { max-width:760px; margin:20px 0 28px; border:1px solid #d9e3ee; border-radius:10px; overflow:hidden; box-shadow:0 4px 14px #16395912; background:#fff; }
.uy-clinical-doc__header { margin:0; padding:16px 22px; background:linear-gradient(110deg,#002b6e,#0057b8 70%,#0072ce); border-bottom:3px solid #f5a623; }
.uy-clinical-doc__title { margin:0; color:#fff; font-size:18px; font-weight:650; }
.uy-clinical-doc__subtitle { margin:4px 0 0; color:#e3efff; font-size:12.5px; }
.uy-clinical-doc__section { padding:14px 22px; border-top:1px solid #e4ebf2; }
.uy-clinical-doc__section:first-of-type { border-top:0; }
.uy-clinical-doc__section--patient,.uy-clinical-doc__section--encounter { background:#f5f8fc; }
.uy-clinical-doc__section-title { margin:0 0 8px; color:#163959; font-size:13px; font-weight:650; text-transform:uppercase; letter-spacing:.4px; }
.uy-clinical-doc__section p { margin:0; color:#24374a; line-height:1.55; }
.uy-clinical-doc__fields { display:grid; grid-template-columns:max-content 1fr; column-gap:16px; row-gap:4px; margin:0; }
.uy-clinical-doc__fields dt { color:#4d6073; font-weight:600; }
.uy-clinical-doc__fields dd { margin:0; color:#24374a; }
.uy-clinical-doc__section--followup { background:#fff8e8; }
@media(max-width:560px) {
  .uy-clinical-doc__fields { grid-template-columns:1fr; }
}
/* Tablas narrativas: opción «Líneas finas». Las tablas de jerarquía generadas conservan sus controles y estilos. */
#segment-content table:not([class]):not([data-fhir]):not([fhir]):not([border]) { width:100%; max-width:100%; margin:14px 0 22px; border-collapse:collapse; }
#segment-content table:not([class]):not([data-fhir]):not([fhir]):not([border]) :is(th,td) { padding:10px 13px; border:0; text-align:left; vertical-align:top; }
#segment-content table:not([class]):not([data-fhir]):not([fhir]):not([border]) thead th { color:#163959; font-weight:650; border-bottom:1px solid #8ca4bd; }
#segment-content table:not([class]):not([data-fhir]):not([fhir]):not([border]) tbody tr + tr > :is(th,td) { border-top:1px solid #e4ebf2; }
/* La misma separación horizontal en tablas técnicas grid, sin alterar los árboles de perfiles del Publisher. */
#segment-content table.grid:not([data-fhir]):not([fhir]) { border:0; border-collapse:collapse; }
#segment-content table.grid:not([data-fhir]):not([fhir]) :is(th,td) { padding:8px 10px; border:0; border-bottom:1px solid #e4ebf2; }
#segment-content table.grid:not([data-fhir]):not([fhir]) tr:first-child > :is(th,td) { border-bottom-color:#8ca4bd; }
.uy-search-page { max-width:920px; margin-top:8px; padding:26px; background:linear-gradient(145deg,#f8fbff,#fff); border:1px solid #d9e3ee; border-radius:12px; box-shadow:0 5px 16px #16395912; }
.uy-search-intro { max-width:660px; margin:0; color:#40566b; }

.uy-search-controls button { display:grid; place-items:center; width:48px; padding:0; color:#163959; background:#f5a623; border:0; border-left:1px solid #d89216; border-radius:0; }
.uy-search-controls button:hover { color:#002b6e; background:#f8c94f; }
.uy-search-controls button svg { width:21px; height:21px; fill:currentColor; }
.uy-search-controls:focus-within { outline:3px solid #f5a623; outline-offset:2px; }

.uy-search-result:hover { border-color:#9bb8d4; box-shadow:0 3px 10px #16395916; }
.uy-search-result a { font-size:17px; font-weight:700; }
.uy-search-result p { margin:7px 0 0; color:#3f5265; line-height:1.55; }
#publish-box,.alert-warning { background-color:#fff4cf; border:1px solid #e2bd61; border-left:4px solid #d9a52b; border-radius:6px; padding:12px 16px; }

</style>
