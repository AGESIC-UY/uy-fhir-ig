<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" role="img" aria-labelledby="hcen-cu-registrar-paciente-title hcen-cu-registrar-paciente-desc">
  <title id="hcen-cu-registrar-paciente-title">Registrar o actualizar un paciente</title>
  <desc id="hcen-cu-registrar-paciente-desc">El prestador envía a Plataforma el paciente con su MRN y los datos conocidos. Plataforma crea o actualiza el registro y devuelve el resultado.</desc>
  <defs>
    <linearGradient id="hcen-cu-registrar-paciente-plataforma" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163959"/><stop offset="1" stop-color="#0057b8"/></linearGradient>
    <marker id="hcen-cu-registrar-paciente-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#0057b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="312" rx="18" fill="#f8fbff" stroke="#d9e3ee" stroke-width="2"/>
  <path d="M150 84 V296" stroke="#8ca4bd" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="45" y="22" width="210" height="62" rx="13" fill="#ffffff" stroke="#0057b8" stroke-width="2.5"/>
  <text x="150" y="49" text-anchor="middle" fill="#003580" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700">Prestador</text>
  <text x="150" y="70" text-anchor="middle" fill="#40566b" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Fuente de identidad</text>
  <path d="M610 84 V296" stroke="#8ca4bd" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="505" y="22" width="210" height="62" rx="13" fill="url(#hcen-cu-registrar-paciente-plataforma)"/>
  <text x="610" y="49" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700">Plataforma</text>
  <text x="610" y="70" text-anchor="middle" fill="#dbe9f8" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Registro central</text>
  <text x="380.0" y="130" text-anchor="middle" fill="#24374a" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Paciente con su MRN y los datos conocidos</text>
  <path d="M166 142 H606" fill="none" stroke="#0057b8" stroke-width="2.5" marker-end="url(#hcen-cu-registrar-paciente-arrow)"/>
  <circle cx="150" cy="142" r="12" fill="#0057b8"/><text x="150" y="147" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">1</text>
  <rect x="495.0" y="170" width="230" height="54" rx="9" fill="#fff4cf" stroke="#e0b94a" stroke-width="1.5"/>
  <text x="610" y="194" text-anchor="middle" fill="#24374a" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Crea o actualiza el registro</text>
  <text x="610" y="212" text-anchor="middle" fill="#24374a" font-family="'Segoe UI', Arial, sans-serif" font-size="14">del paciente</text>
  <text x="380.0" y="254" text-anchor="middle" fill="#24374a" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Resultado: creado, actualizado o error</text>
  <path d="M594 266 H154" fill="none" stroke="#0057b8" stroke-width="2.5" marker-end="url(#hcen-cu-registrar-paciente-arrow)"/>
  <circle cx="610" cy="266" r="12" fill="#0057b8"/><text x="610" y="271" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">2</text>
</svg>
