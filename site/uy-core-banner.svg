<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003580;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0057b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8c94f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="12"/>

  <!-- Decorative circles (connectivity nodes) -->
  <circle cx="760" cy="60" r="80" fill="white" opacity="0.04"/>
  <circle cx="820" cy="200" r="60" fill="white" opacity="0.04"/>
  <circle cx="680" cy="240" r="50" fill="white" opacity="0.03"/>

  <!-- Network lines (interoperability theme) -->
  <line x1="600" y1="50" x2="720" y2="120" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="120" x2="800" y2="80" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="120" x2="760" y2="200" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="800" y1="80" x2="860" y2="150" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="760" y1="200" x2="860" y2="150" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="600" y1="50" x2="640" y2="160" stroke="white" stroke-width="1" opacity="0.12"/>
  <line x1="640" y1="160" x2="760" y2="200" stroke="white" stroke-width="1" opacity="0.12"/>

  <!-- Network nodes -->
  <circle cx="600" cy="50"  r="6" fill="white" opacity="0.5"/>
  <circle cx="720" cy="120" r="9" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="800" cy="80"  r="6" fill="white" opacity="0.5"/>
  <circle cx="760" cy="200" r="6" fill="white" opacity="0.5"/>
  <circle cx="860" cy="150" r="6" fill="white" opacity="0.5"/>
  <circle cx="640" cy="160" r="6" fill="white" opacity="0.4"/>

  <!-- Accent bar -->
  <rect x="40" y="200" width="420" height="4" rx="2" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- UY Core Title -->
  <text x="48" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700"
        fill="white" filter="url(#shadow)" letter-spacing="2">FHIR Uruguay</text>

  <!-- Subtitle -->
  <text x="50" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400"
        fill="white" opacity="0.92" letter-spacing="0.5">Guía de Implementación FHIR de Uruguay</text>

  <!-- Country + org -->
  <text x="50" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="300"
        fill="white" opacity="0.75">Base nacional Core e interoperabilidad con HCEN</text>

  <!-- FHIR badge -->
  <rect x="50" y="218" width="120" height="34" rx="17" fill="white" opacity="0.15"/>
  <text x="110" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600"
        fill="white" text-anchor="middle" letter-spacing="1">HL7 FHIR R4</text>

  <!-- UY CORE badge -->
  <rect x="184" y="218" width="120" height="34" rx="17" fill="white" opacity="0.15"/>
  <text x="244" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600"
        fill="white" text-anchor="middle" letter-spacing="1">CORE + HCEN</text>

  <!-- Borrador badge -->
  <rect x="318" y="218" width="100" height="34" rx="17" fill="url(#accentGrad)" opacity="0.85"/>
  <text x="368" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700"
        fill="#003580" text-anchor="middle" letter-spacing="1">Borrador</text>
</svg>
