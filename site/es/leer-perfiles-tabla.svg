<svg xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="title desc" lang="es"><title id="title">Columnas de una tabla de perfil</title><desc id="desc">Nombre, marcas, cardinalidad, tipo y descripción. name tiene marca S y cardinalidad 0..1: soporte y presencia son reglas diferentes.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.body{font-size:18px}.small{font-size:16px;fill:#42526e}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700;fill:#0057b8}.mono{font:17px Consolas,monospace}.badge{font-size:16px;fill:white;text-anchor:middle;font-weight:700}</style><rect width="960" height="542" rx="12" fill="#f5f8fc"/><text x="28" y="40" class="title">Cómo leer una fila de HCENPatient</text><text x="28" y="70" class="small">Selección de elementos · rótulos simplificados</text><rect x="28" y="102" width="904" height="256" rx="8" fill="#fff" stroke="#cbd5e1"/><circle cx="48" cy="125" r="14" fill="#0057b8"/><text x="48" y="130" class="badge">1</text><circle cx="299" cy="125" r="14" fill="#0057b8"/><text x="299" y="130" class="badge">2</text><circle cx="377" cy="125" r="14" fill="#0057b8"/><text x="377" y="130" class="badge">3</text><circle cx="465" cy="125" r="14" fill="#0057b8"/><text x="465" y="130" class="badge">4</text><circle cx="678" cy="125" r="14" fill="#0057b8"/><text x="678" y="130" class="badge">5</text><text x="40" y="168" class="head">Nombre</text><text x="291" y="168" class="head">Marcas</text><text x="369" y="168" class="head">Card.</text><text x="457" y="168" class="head">Tipo</text><text x="670" y="168" class="head">Descripción</text><text x="40" y="207" class="mono">identifier</text><text x="291" y="207" class="mono"></text><text x="369" y="207" class="mono">1..*</text><text x="457" y="207" class="mono">Identifier</text><text x="670" y="207" class="small">Identificadores</text><text x="78" y="250" class="mono">mrn</text><text x="291" y="250" class="mono"></text><text x="369" y="250" class="mono">1..1</text><text x="457" y="250" class="mono">HCENMRNIdentifier</text><text x="670" y="250" class="small">Número interno</text><rect x="29" y="265" width="902" height="41" fill="#e4f0ff"/><text x="40" y="293" class="mono">name</text><text x="291" y="293" class="mono">S</text><text x="369" y="293" class="mono">0..1</text><text x="457" y="293" class="mono">UYHumanName</text><text x="670" y="293" class="small">Nombre del paciente</text><text x="40" y="336" class="mono">photo</text><text x="291" y="336" class="mono"></text><text x="369" y="336" class="mono">0..0</text><text x="457" y="336" class="mono">Attachment</text><text x="670" y="336" class="small">No permitido</text><path d="M46 215 L46 250" fill="none" stroke="#0057b8" stroke-width="2"/><path d="M46 250 L65 250" fill="none" stroke="#0057b8" stroke-width="2"/><rect x="28" y="387" width="437" height="99" rx="8" fill="#edf5ff" stroke="#0057b8"/><text x="48" y="419" class="head">S = Must Support</text><text x="48" y="452" class="body">Consultar las obligaciones del actor.</text><rect x="493" y="387" width="439" height="99" rx="8" fill="#fff7e5" stroke="#c99935"/><text x="513" y="419" class="head">0..1 = presencia opcional</text><text x="513" y="452" class="body">Si se incluye name, aparece una vez.</text><text x="28" y="518" class="small">El tipo UYHumanName enlaza con las reglas del nombre y sus extensiones.</text></svg>