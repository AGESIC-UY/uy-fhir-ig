<svg xmlns="http://www.w3.org/2000/svg" width="960" height="479" viewBox="0 0 960 479" role="img" aria-labelledby="title desc" lang="es"><title id="title">Binding y valor fijo</title><desc id="desc">state tiene cardinalidad 0..1 y binding required a departamentos. country tiene cardinalidad 1..1 y valor fijo URY.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.body{font-size:18px}.small{font-size:16px;fill:#42526e}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700;fill:#0057b8}.mono{font:17px Consolas,monospace}.badge{font-size:16px;fill:white;text-anchor:middle;font-weight:700}</style><rect width="960" height="479" rx="12" fill="#f5f8fc"/><text x="28" y="40" class="title">Valores permitidos: ejemplo de UYAddress</text><text x="28" y="70" class="small">Dos campos de la misma dirección, con reglas diferentes</text><rect x="28" y="98" width="904" height="130" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="48" y="130" class="head">Elemento</text><text x="240" y="130" class="head">Card.</text><text x="355" y="130" class="head">Regla de valor</text><text x="48" y="168" class="mono">state</text><text x="240" y="168" class="mono">0..1</text><text x="355" y="168" class="mono">Departamentos de Uruguay (required)</text><text x="48" y="207" class="mono">country</text><text x="240" y="207" class="mono">1..1</text><text x="355" y="207" class="mono">Valor fijo: "URY"</text><rect x="28" y="255" width="437" height="162" rx="8" fill="#edf5ff" stroke="#0057b8"/><text x="48" y="290" class="head">state: elegir del conjunto</text><text x="48" y="326" class="body">Puede omitirse. Si se informa, debe</text><text x="48" y="354" class="body">pertenecer al ValueSet de departamentos.</text><text x="48" y="389" class="mono">Ejemplo de valor: "Montevideo"</text><rect x="493" y="255" width="439" height="162" rx="8" fill="#fff7e5" stroke="#c99935"/><text x="513" y="290" class="head">country: usar el valor fijo</text><text x="513" y="326" class="body">Cada dirección que siga UYAddress</text><text x="513" y="354" class="body">debe incluir exactamente este valor:</text><text x="513" y="389" class="mono">"country": "URY"</text><text x="28" y="453" class="small">required limita el valor; la cardinalidad determina si el campo debe aparecer.</text></svg>